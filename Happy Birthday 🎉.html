<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Happy Birthday 🎉</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #fbeee6, #f7d9c4);
    text-align: center;
    overflow-x: hidden;
}

#home {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#home h1 {
    font-size: 60px;
    color: #d46a6a;
    animation: fadeIn 2s ease;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    background: #d46a6a;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #b94e4e;
    transform: scale(1.05);
}

#surprise {
    display: none;
    padding: 20px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 20px;
    transition: 0.4s;
}

.gallery img:hover {
    transform: scale(1.05);
}

.message {
    font-size: 20px;
    color: #555;
    margin-top: 20px;
    animation: fadeIn 2s ease;
}

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: 0;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
    }
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(-20px);}
    to {opacity:1; transform: translateY(0);}
}
</style>
</head>

<body>

<div id="home" style="display: none;">
    <h1>🎉 Happy Birthday 🎂</h1>
    <p>Click below to open your surprise 💖</p>
    <button onclick="openSurprise()">Open Surprise 🎁</button>
</div>

<div id="surprise" style="display: block;">
    <h1>✨ Your Special Memories ✨</h1>

    <div class="gallery">
        <img src="./Happy Birthday 🎉_files/image.png">
        <img src="./Happy Birthday 🎉_files/yash3.image.jpeg">
        <img src="./Happy Birthday 🎉_files/yash.image.jpeg">
        <img src="./Happy Birthday 🎉_files/yash2.image.jpeg">
    </div>

    <div class="message">
        Happy Birthday my dear son!! 🎂💖 <br><br>
        Wishing you endless happiness, love, and success 🌈✨ <br>
        You are truly special, you are a blessing 🎁 <br>
        May all your dreams come true ✨
    </div>
</div>

<!-- AUDIO -->
<audio id="music" loop="">
    <source src="./Nagutha-Nagutha.mp3" type="audio/mpeg">
</audio>

<script>
function openSurprise() {
    document.getElementById("home").style.display = "none";
    document.getElementById("surprise").style.display = "block";

    // Play music
    let music = document.getElementById("music");
    music.play().catch(() => {
        console.log("Autoplay blocked, user interaction needed.");
    });

    for (let i = 0; i < 60; i++) {
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        confetti.style.background = ["#ff4d4d", "#ffd11a", "#66ff66", "#66ccff"][Math.floor(Math.random()*4)];
        document.body.appendChild(confetti);
    }
}
</script>
